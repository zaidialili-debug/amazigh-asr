name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.14"

      - name: Verifier les versions installees
        run: |
          python -c "import torch; print('TORCH =', torch.__version__)"
          python -c "import torchaudio; print('TORCHAUDIO =', torchaudio.__version__)"
          python -c "import transformers; print('TRANSFORMERS =', transformers.__version__)"
          pip list

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onedir --windowed --noupx --name "AmazighASR" --icon=icon.ico --add-data "icons;icons" --add-data "crlca.png;." --add-data "logo1.png;." --exclude-module sentencepiece --exclude-module torch.testing --exclude-module torchgen --exclude-module tensorflow --exclude-module IPython --exclude-module notebook --exclude-module tkinter --exclude-module PySide2 --exclude-module PySide6 --exclude-module PyQt6 main.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download VC++ Redistributable
        run: curl -L -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe

      - name: Compile installer with Inno Setup
        run: iscc installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmazighASR-Installer
          path: Output/*.exe
